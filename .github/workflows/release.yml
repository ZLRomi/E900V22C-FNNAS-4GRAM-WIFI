name: Full Build & Release

# 触发方式：
#   1) 打 tag（发布版）:  git tag v1.0 && git push origin v1.0
#   2) 手动触发:          Actions 页面 -> Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 官方最新 s905l3a 镜像（ophub/fnnas）。若官方发布新内核，更新此 URL。
  BASE_IMG_URL: "https://github.com/ophub/fnnas/releases/download/fnnas_amlogic_1252/fnnas_amlogic_s905l3a_k6.18.18_2026.06.25.img.gz"
  PROD_DTB: "dtb-variants/v8b-uwe5621ds-3.97g-ddr52.dtb"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gzip util-linux dosfstools zip

      # ---------- 完整构建：官方镜像 + 生产 dtb ----------
      - name: Build full .img (inject production dtb)
        run: |
          sudo bash scripts/build_full_img.sh \
            "$BASE_IMG_URL" \
            "$PROD_DTB" \
            out/release
          # 脚本内 sudo 创建的产物 owner 为 root，归还给当前用户，供后续步骤写
          sudo chown -R "$(id -u):$(id -g)" out/release

      # ---------- 同时附加 dtb 合集 zip ----------
      - name: Package dtb collection
        run: |
          cd "$GITHUB_WORKSPACE"
          # 生产版规范名（整盘 /dtb/amlogic 同名文件，免改 uEnv）
          mkdir -p out/release/dtb-all/dtb/amlogic
          cp "${PROD_DTB}" out/release/dtb-all/dtb/amlogic/meson-g12a-s905l3a-e900v22c.dtb
          # 全部变体
          cp dtb-variants/*.dtb out/release/dtb-all/ 2>/dev/null || true
          # 最小烧录包
          cp out/fnnas-e900v22c-minbootloader.img out/release/ 2>/dev/null || true
          cd out/release
          zip -r ../../dtb-collection.zip dtb-all >/dev/null
          echo "--- release 目录 ---" && ls -lh
          echo "--- 上传资产 ---" && ls -lh ./*.img.gz meson-g12a-s905l3a-e900v22c.dtb fnnas-e900v22c-minbootloader.img 2>/dev/null; ls -lh ../../dtb-collection.zip

      # ---------- 发布到 GitHub Release ----------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/release/*.img.gz
            out/release/meson-g12a-s905l3a-e900v22c.dtb
            out/release/fnnas-e900v22c-minbootloader.img
            dtb-collection.zip
          generate_release_notes: true