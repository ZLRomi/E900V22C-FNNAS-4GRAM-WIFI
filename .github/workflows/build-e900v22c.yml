name: Build E900V22C 4G RAM + WiFi

# ============================================================================
# 在 ophub/fnnas 的基础上构建 E900V22C 专用镜像，Release 只发布 2 个文件：
#   1. fnnas_amlogic_s905l3a_e900v22c-4g-wifi_k6.12.41_<日期>.img.xz
#   2. meson-g12a-s905l3a-e900v22c.dtb        （4G 运存 dtb）
#
# 依赖本 fork 里新增/覆盖的文件：
#   make-fnnas/fnnas-files/different-files/e900v22c/
#       bootfs/dtb/amlogic/meson-g12a-s905l3a-e900v22c.dtb   4G 运存 dtb
#       rootfs/lib/modules/6.12.41-trim/extra/*.ko            WiFi 驱动（vermagic 6.12.41-trim）
#       rootfs/etc/...                                        配置 + 服务 enable
#   make-fnnas/fnnas-files/platform-files/amlogic/rootfs/usr/sbin/fnnas-install
#       生产版安装脚本（无 dtb 选择 / 仅 4G / 内存保护）
#
# ⚠ 内核必须锁 6.12.41：
#   驱动模块 vermagic = "6.12.41-trim SMP preempt mod_unload aarch64"，
#   内核一旦不是 6.12.41，insmod 会直接拒绝，WiFi 就没了。
#   renas 只有在 auto_kernel=false 时才会原样使用 -k 指定的版本，
#   所以下面 auto_kernel 必须为 'false' 且 fnnas_kernel 必须写精确版本号。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      fnnas_base_version:
        description: '基础镜像版本（amlogic_1252 为最新）'
        required: false
        default: 'amlogic_1252'
        type: choice
        options:
          - amlogic_1252
          - amlogic_693
      release_tag:
        description: '发布 tag（留空 = 自动 e900v22c-<日期>-<构建号>）'
        required: false
        default: ''
  push:
    tags:
      - 'e900v22c-*'

permissions:
  contents: write

env:
  # 驱动模块的 vermagic 决定内核版本，不要改
  KERNEL_VERSION: '6.12.41'
  BOARD: 'amlogic'
  DTB_NAME: 'meson-g12a-s905l3a-e900v22c.dtb'
  DTB_SRC: 'make-fnnas/fnnas-files/different-files/e900v22c/bootfs/dtb/amlogic/meson-g12a-s905l3a-e900v22c.dtb'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 检出 fork
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "=== 清理前 ==="; df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean || true
          echo "=== 清理后 ==="; df -h / || true

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler mtools btrfs-progs dosfstools \
            xz-utils zstd gzip file jq curl

      - name: 构建前守门（校验差异化文件）
        run: |
          set -e
          echo "::group::dtb 内存边界"
          test -f "$DTB_SRC" || { echo "★ 缺 dtb: $DTB_SRC"; exit 1; }
          dtc -I dtb -O dts "$DTB_SRC" | grep -A3 'memory@0'
          dtc -I dtb -O dts "$DTB_SRC" | grep -q '0xf5700000' \
            || { echo "★ dtb 内存边界不是 0xf5700000（4G 安全值），拒绝构建"; exit 1; }
          echo "::endgroup::"

          echo "::group::WiFi 驱动"
          KO_DIR=make-fnnas/fnnas-files/different-files/e900v22c/rootfs/lib/modules/${KERNEL_VERSION}-trim/extra
          test -f "$KO_DIR/sprdwl_ng.ko"        || { echo "★ 缺 sprdwl_ng.ko"; exit 1; }
          test -f "$KO_DIR/uwe5621_bsp_sdio.ko" || { echo "★ 缺 uwe5621_bsp_sdio.ko"; exit 1; }
          for ko in "$KO_DIR"/*.ko; do
            echo "--- $(basename "$ko") ---"
            modinfo "$ko" 2>/dev/null | grep -E 'vermagic|filename' || true
            modinfo -F vermagic "$ko" | grep -q "6.12.41-trim" \
              || { echo "★ $(basename "$ko") 的 vermagic 不是 6.12.41-trim"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::生产版安装脚本"
          FI=make-fnnas/fnnas-files/platform-files/amlogic/rootfs/usr/sbin/fnnas-install
          test -f "$FI" || { echo "★ 缺 fnnas-install"; exit 1; }
          grep -c '4G-PROD' "$FI" | sed 's/^/  4G-PROD 标记数: /'
          grep -q '4G-PROD' "$FI" || { echo "★ fnnas-install 不是生产版"; exit 1; }
          echo "::endgroup::"
          echo "✓ 差异化文件全部就绪"

      - name: 解析基础镜像下载地址
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ inputs.fnnas_base_version }}"
          [ -n "$VER" ] || VER="amlogic_1252"
          echo "基础镜像版本: $VER"
          URL=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/ophub/fnnas/releases?per_page=30" \
            | jq -r --arg BOARD "$VER" \
                '[.[] | select(.tag_name | contains("fnnas_base_image"))]
                 | map(.assets[] | select(.name | contains($BOARD) and endswith(".img.xz")))
                 | sort_by(.updated_at) | reverse | .[0].browser_download_url')
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "★ 解析基础镜像地址失败"; exit 1; }
          echo "基础镜像: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: 构建镜像（调用 ophub 官方构建流程）
        uses: ./
        with:
          build_target: 'fnnas'
          fnnas_path: ${{ steps.base.outputs.url }}
          fnnas_board: amlogic
          kernel_repo: ophub/fnnas
          fnnas_kernel: '6.12.41'
          auto_kernel: 'false'
          fnnas_size: '512/4096'
          rootfs_expand: '16'
          builder_name: 'e900v22c-4g-wifi'

      - name: 校验产物
        id: check
        run: |
          set -euo pipefail
          echo "::group::构建输出"
          ls -lh fnnas/out/ 2>/dev/null || true
          echo "::endgroup::"
          IMG=$(ls fnnas/out/*.img.xz 2>/dev/null | head -1)
          [ -n "$IMG" ] || IMG=$(ls fnnas/out/*.img.gz 2>/dev/null | head -1)
          [ -n "$IMG" ] || IMG=$(ls fnnas/out/*.img 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "★ 找不到镜像产物"; ls -R fnnas/out 2>/dev/null | head -40; exit 1; }
          echo "镜像产物: $IMG ($(du -h "$IMG" | cut -f1))"
          echo "img=$IMG" >> $GITHUB_OUTPUT

          # 冒烟测试：镜像里的 dtb 与 WiFi 驱动
          case "$IMG" in
            *.xz) xz -dc "$IMG" > /tmp/v.img ;;
            *.gz) gunzip -c "$IMG" > /tmp/v.img ;;
            *)    cp "$IMG" /tmp/v.img ;;
          esac
          sfdisk -d /tmp/v.img | head -6
          OFF1=$(sfdisk -d /tmp/v.img | awk -F'start=' '/img1/{split($2,a,","); print a[1]*512}' | head -1)
          export MTOOLS_SKIP_CHECK=1
          mcopy -i "/tmp/v.img@@${OFF1}" "::/dtb/amlogic/${DTB_NAME}" /tmp/got.dtb
          dtc -I dtb -O dts /tmp/got.dtb | grep -A3 'memory@0'
          dtc -I dtb -O dts /tmp/got.dtb | grep -q '0xf5700000' \
            || { echo "★ 镜像里的 dtb 内存边界不对"; exit 1; }
          echo "✓ 镜像内 dtb 正确"

          OFF2=$(sfdisk -d /tmp/v.img | awk -F'start=' '/img2/{split($2,a,","); print a[1]*512}' | head -1)
          LOOP=$(sudo losetup --show -f -o "$OFF2" /tmp/v.img)
          sudo mkdir -p /mnt/vroot && sudo mount "$LOOP" /mnt/vroot
          echo "--- 内核版本 ---"
          ls /mnt/vroot/lib/modules/
          ls /mnt/vroot/lib/modules/*/extra/ 2>/dev/null || echo "  (extra 目录为空)"
          echo "--- fnnas-install ---"
          sudo grep -c '4G-PROD' /mnt/vroot/usr/sbin/fnnas-install
          echo "--- 服务 enable ---"
          sudo ls -la /mnt/vroot/etc/systemd/system/multi-user.target.wants/ | head -12
          sudo umount /mnt/vroot
          sudo losetup -d "$LOOP"
          rm -f /tmp/v.img
          echo "✓ 冒烟测试通过"

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          IMG="${{ steps.check.outputs.img }}"
          {
            echo "## E900V22C (S905L3A) FnNAS 4G 运存 + WiFi"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 机型 | 创维 E900V22C / S905L3A（4G 运存） |"
            echo "| 内核 | ${KERNEL_VERSION}-trim |"
            echo "| 内存 | 3927 MiB 可用（边界 0xf5700000，顶部 169MiB 留给 BL31/TEE） |"
            echo "| WiFi | 紫光展锐 UWE5621DS（dev_addr + conn-leak 双补丁） |"
            echo "| eMMC | DDR52 @50MHz |"
            echo "| 安装脚本 | 生产版 fnnas-install：无 dtb 选择 / 仅 4G / 内存保护 |"
            echo ""
            echo "### 两个文件"
            echo ""
            echo "- \`$(basename "$IMG")\` — 系统镜像，用 balenaEtcher 写入 U 盘 / TF 卡"
            echo "- \`${DTB_NAME}\` — 4G 运存 dtb（也可单独替换到已装系统的 /boot/dtb/amlogic/）"
            echo ""
            echo "### 校验"
            echo ""
            echo '```'
            echo "img: $(sha256sum "$IMG" | awk '{print $1}')"
            echo "dtb: $(sha256sum "$DTB_SRC" | awk '{print $1}')"
            echo '```'
            echo ""
            echo "### 使用"
            echo ""
            echo "1. balenaEtcher 写入 U 盘（≥16GB）"
            echo "2. 插盒子开机，浏览器打开 \`http://<盒子IP>:5666\`"
            echo "3. 装到 eMMC：\`sudo fnnas-install -y\`"
          } > release-notes.md
          cat release-notes.md

      - name: 发布 Release（只有 2 个附件）
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="${{ steps.check.outputs.img }}"
          IMG_BASE="fnnas_${BOARD}_s905l3a_e900v22c-4g-wifi_k${KERNEL_VERSION}_$(date +%Y.%m.%d).img.xz"
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="e900v22c-$(date +%Y.%m.%d)-${{ github.run_number }}"

          cp -f "$IMG" "$IMG_BASE"
          cp -f "$DTB_SRC" "$DTB_NAME"
          ls -lh "$IMG_BASE" "$DTB_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" "$IMG_BASE" "$DTB_NAME" --clobber
          else
            gh release create "$TAG" "$IMG_BASE" "$DTB_NAME" \
              --title "E900V22C 4G运存+WiFi ($TAG)" \
              --notes-file release-notes.md
          fi
          echo "=== 最终附件 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) B"'
          echo "release_url=$(gh release view "$TAG" --json url --jq .url)" >> $GITHUB_OUTPUT

      - name: 汇总
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 内核: ${KERNEL_VERSION}-trim" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: ${{ steps.check.outputs.img }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ steps.release.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
