name: Build Image and 4G DTB

# ============================================================================
# 产出（Release 里只有这 2 个附件）：
#   1. fnnas_amlogic_s905l3a_e900v22c-4g_k6.18.18_<日期>.img.xz
#   2. meson-g12a-s905l3a-e900v22c.dtb            （4G 运存 dtb）
#
# 分工：
#   · 构建逻辑在 ZLRomi/fnnas（ophub/fnnas 的 fork）
#       - different-files/e900v22c/    4G dtb + 配置 + 服务 enable（无 WiFi ko，需用户自行编译）
#       - platform-files/amlogic/      生产版 fnnas-install
#   · 本仓库只负责触发构建 + 发布 Release，所以镜像永远与本仓库的 4G 修复一致
# ⚠ 内核锁 6.18.18：6.18 系列内核，WiFi 驱动需用户自行对 6.18 编译（原 6.12 ko 不兼容）。
#   renas 只在 auto_kernel=false 时才原样使用 -k 指定的版本，故两者都要写死。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: '基础镜像版本（amlogic_1252 为最新）'
        required: false
        default: 'amlogic_1252'
        type: choice
        options:
          - amlogic_1252
          - amlogic_693
      release_tag:
        description: '发布 tag（留空 = 自动 e900v22c-<日期>-<构建号>）'
        required: false
        default: ''
  push:
    tags:
      - 'e900v22c-*'

permissions:
  contents: write

env:
  # 构建链已并入本仓库，用仓库自身（uses: ./）
  SELF_REF: 'main'
  KERNEL_VERSION: '6.18.18'
  BOARD: 'amlogic'
  DTB_NAME: 'meson-g12a-s905l3a-e900v22c.dtb'
  DTB_IN_FORK: 'make-fnnas/fnnas-files/different-files/e900v22c/bootfs/dtb/amlogic/meson-g12a-s905l3a-e900v22c.dtb'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 初始化构建环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get -y update || true
          DEPS="$(curl -fsSL https://ophub.org/ubuntu2604-make-fnnas-depends 2>/dev/null || true)"
          FALLBACK="build-essential device-tree-compiler mtools btrfs-progs dosfstools xz-utils zstd gzip file jq parted pv rsync"
          if [ -n "${DEPS}" ]; then
            echo "使用官方依赖清单"
            sudo apt-get -y install ${DEPS} || sudo apt-get -y install ${FALLBACK}
          else
            echo "官方清单获取失败，使用内置清单"
            sudo apt-get -y install ${FALLBACK}
          fi
          sudo apt-get clean || true
          # GitHub runner 里没有 systemd，且 run 步骤默认 bash -e，
          # 所以不要调 systemctl / timedatectl（一条失败整步就挂）
          date -u
          df -h /
          echo "deps ready"

      - name: 校验 fork 里的差异化文件（构建前守门）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # fork 必须是公开可读的
          DTB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SELF_REF}/${DTB_IN_FORK}"
          curl -fsSL "$DTB_URL" -o /tmp/check.dtb
          echo "--- fork 里的 dtb ---"
          ls -la /tmp/check.dtb
          dtc -I dtb -O dts /tmp/check.dtb | grep -A3 'memory@0'
          dtc -I dtb -O dts /tmp/check.dtb | grep -q '0xf5700000' \
            || { echo "::error::fork 里的 dtb 内存边界不是 0xf5700000（4G 安全值）"; exit 1; }
          echo "✓ dtb 正确"

          echo "--- fork 里的生产版安装脚本 ---"
          FI_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SELF_REF}/make-fnnas/fnnas-files/platform-files/amlogic/rootfs/usr/sbin/fnnas-install"
          curl -fsSL "$FI_URL" -o /tmp/fnnas-install
          grep -c '4G-PROD' /tmp/fnnas-install | sed 's/^/  4G-PROD 标记数: /'
          grep -q '4G-PROD' /tmp/fnnas-install || { echo "::error::不是生产版安装脚本"; exit 1; }

          echo "--- fork 里的 OTA 防护（e900v22c 专用）---"
          BB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SELF_REF}/make-fnnas/fnnas-files/different-files/e900v22c/rootfs/etc/device_info/boot_board"
          curl -fsSL "$BB_URL" -o /tmp/boot_board || { echo "::error::fork 里缺 etc/device_info/boot_board"; exit 1; }
          grep -q '^e900v22c$' /tmp/boot_board || { echo "::error::boot_board 必须恰为 e900v22c"; exit 1; }
          echo "  ✓ boot_board = e900v22c"
          GW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SELF_REF}/make-fnnas/fnnas-files/different-files/e900v22c/rootfs/usr/lib/fnnas-e900v22c/fnnas-update-wrapper.sh"
          curl -fsSL "$GW_URL" -o /tmp/fnnas-update-wrapper.sh || { echo "::error::fork 里缺 fnnas-update-wrapper.sh"; exit 1; }
          bash -n /tmp/fnnas-update-wrapper.sh || { echo "::error::wrapper 语法错误"; exit 1; }
          grep -q 'fnnas-update.real' /tmp/fnnas-update-wrapper.sh || { echo "::error::wrapper 未引用 .real 备份"; exit 1; }
          grep -q 'PIN_PREFIX="\$(uname -r' /tmp/fnnas-update-wrapper.sh || { echo "::error::wrapper 未用动态 PIN_PREFIX (uname -r)"; exit 1; }
          echo "  ✓ kernel-OTA guard 在位"
          RC_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SELF_REF}/make-fnnas/fnnas-files/common-files/etc/rc.local"
          curl -fsSL "$RC_URL" -o /tmp/rc.local
          grep -q 'fnnas-update guard installed' /tmp/rc.local || { echo "::error::rc.local 未装 guard 安装钩"; exit 1; }
          grep -q 'systemctl --no-block start' /tmp/rc.local || { echo "::error::rc.local 缺 --no-block（会与 After=rc-local 的单元死锁，trim 起不来）"; exit 1; }
          bash -n /tmp/rc.local || { echo "::error::rc.local 语法错误"; exit 1; }
          echo "  ✓ rc.local 钩子在位"
          echo "--- fork 里的服务 mask（必须为指向 /dev/null 的软链）---"
          for m in serial-getty@ttyAMA0.service exim4.service led-set.service set_gpio-init.service nut-monitor.service nut-server.service; do
            P="make-fnnas/fnnas-files/different-files/e900v22c/rootfs/etc/systemd/system/$m"
            [ -L "$P" ] || { echo "::error::$P 不是软链（mask 失效）"; exit 1; }
            [ "$(readlink "$P")" = "/dev/null" ] || { echo "::error::$P 未指向 /dev/null"; exit 1; }
            echo "  ✓ mask $m -> /dev/null"
          done
          echo "✓ 守门全部通过"

- name: 解析基础镜像地址
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 优先用本仓库 Release 里的基础镜像（base-1.2.0302），没有则回退 ophub
          URL=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/base-1.2.0302" \
            | jq -r '.assets[] | select(.name | contains("fnos-1.2.0302-oes-plus-base") and endswith(".img.gz")) | .browser_download_url' | head -1)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "本仓库无基础镜像，回退 ophub..."
            VER="${{ inputs.base_version }}"
            [ -n "$VER" ] || VER="amlogic_1252"
            URL=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/ophub/fnnas/releases?per_page=30" \
              | jq -r --arg B "$VER" \
                  '[.[] | select(.tag_name | contains("fnnas_base_image"))]
                   | map(.assets[] | select(.name | contains($B) and endswith(".img.gz")))
                   | sort_by(.updated_at) | reverse | .[0].browser_download_url')
          fi
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::解析基础镜像失败"; exit 1; }
          echo "基础镜像: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "ver=base-1.2.0302" >> $GITHUB_OUTPUT

      - name: 构建镜像（调用 ZLRomi/fnnas 的构建流程）
        id: mkb
        uses: ./
        with:
          build_target: 'fnnas'
          fnnas_path: ${{ steps.base.outputs.url }}
          fnnas_board: e900v22c
          kernel_repo: ophub/fnnas
          fnnas_kernel: '6.18.18'
          auto_kernel: 'false'
          fnnas_size: '512/4096'
          rootfs_expand: '16'
          builder_name: 'e900v22c-4g'

      - name: 定位构建产物
        id: check
        run: |
          set -uo pipefail
          echo "PACKAGED_OUTPUTPATH=${PACKAGED_OUTPUTPATH}"
          echo "PACKAGED_STATUS=${PACKAGED_STATUS}"
          ls -lh "${PACKAGED_OUTPUTPATH}" || true

          # 构建出什么就发什么：不再强求 .img.xz，保持原始文件名与格式
          IMG="$(ls -1 "${PACKAGED_OUTPUTPATH}"/fnnas_*.img* 2>/dev/null | head -1)"
          [ -n "$IMG" ] || { echo "::error::找不到镜像产物"; ls -R "${PACKAGED_OUTPUTPATH}" | head -40; exit 1; }
          echo "镜像产物: $IMG  ($(du -h "$IMG" | cut -f1))"
          echo "img=$IMG" >> $GITHUB_OUTPUT
          echo "img_name=$(basename "$IMG")" >> $GITHUB_OUTPUT

          # ===== rootfs 结构守门（阻断式）=====
          # usr-merged 系统里 /lib /bin /sbin 必须是【符号链接】。
          # 一旦被覆盖成真实目录，动态加载器就会找不到，init 起不来
          # → Kernel panic "Attempted to kill init! exitcode=0x00000100"
          TMP=/tmp/smoke.img
          case "$IMG" in
            *.xz)  xz -dc "$IMG" > $TMP 2>/dev/null ;;
            *.gz)  gunzip -c "$IMG" > $TMP 2>/dev/null ;;
            *.zst) zstd -dc "$IMG" > $TMP 2>/dev/null ;;
            *)     cp -f "$IMG" $TMP 2>/dev/null ;;
          esac
          if [ ! -s "$TMP" ]; then
            echo "::error::镜像解压失败，无法校验"; exit 1
          fi
          sfdisk -d $TMP 2>/dev/null | head -6 || true
          OFF1=$(sfdisk -d $TMP 2>/dev/null | awk -F'start=' '/img1/{split($2,a,","); print a[1]*512}' | head -1)
          OFF2=$(sfdisk -d $TMP 2>/dev/null | awk -F'start=' '/img2/{split($2,a,","); print a[1]*512}' | head -1)
          if [ -z "${OFF1:-}" ] || [ -z "${OFF2:-}" ]; then
            echo "::error::分区表异常，取不到分区偏移"; exit 1
          fi

          echo "::group::引导分区校验"
          export MTOOLS_SKIP_CHECK=1
          if mcopy -i "$TMP@@${OFF1}" "::/dtb/amlogic/${DTB_NAME}" /tmp/got.dtb 2>/dev/null; then
            dtc -I dtb -O dts /tmp/got.dtb 2>/dev/null | grep -A3 'memory@0' || true
            dtc -I dtb -O dts /tmp/got.dtb 2>/dev/null | grep -q '0xf5700000' \
              || { echo "::error::镜像内 dtb 内存边界不是 0xf5700000"; exit 1; }
            echo "✓ dtb 内存边界 = 0xf5700000（4G 安全值）"
          else
            echo "::error::引导分区里找不到 ${DTB_NAME}"; exit 1
          fi
          echo "::endgroup::"

          echo "::group::rootfs 结构守门"
          LOOP=$(sudo losetup --show -f -o "$OFF2" $TMP)
          sudo mkdir -p /mnt/vroot
          if ! sudo mount "$LOOP" /mnt/vroot; then
            echo "::error::rootfs 挂载失败"; sudo losetup -d "$LOOP" || true; exit 1
          fi

          fail=0
          for d in bin sbin lib; do
            if [ -L "/mnt/vroot/$d" ]; then
              echo "✓ /$d -> $(readlink /mnt/vroot/$d)"
            else
              echo "::error::/$d 不是符号链接 —— usr-merged 结构被破坏，实机必然 panic"
              sudo ls -la /mnt/vroot/ | head -30
              fail=1
            fi
          done
          if [ -e /mnt/vroot/usr/lib/ld-linux-aarch64.so.1 ]; then
            echo "✓ 动态加载器 /usr/lib/ld-linux-aarch64.so.1 存在"
          else
            echo "::error::缺少动态加载器 /usr/lib/ld-linux-aarch64.so.1"; fail=1
          fi

          MODDIR="/mnt/vroot/usr/lib/modules/${KERNEL_VERSION}.c944-trim/extra"
          # WiFi ko 已移除（1.2 线用户自行编译 6.18 ko），此处不再检查
          # if sudo test -f "$MODDIR/$k"; then
          #   echo "✓ WiFi 驱动 $k ($(sudo stat -c%s "$MODDIR/$k" 2>/dev/null) B)"
          # else
          #   echo "::error::缺少 WiFi 驱动 $MODDIR/$k"; fail=1
          # fi
          if test -e /mnt/vroot/lib && ! test -L /mnt/vroot/lib; then
            echo "::error::/lib 被创建成了真实目录（overlay 路径写错了）"
            sudo ls -la /mnt/vroot/lib | head -10
            fail=1
          fi
          echo "  内核版本目录: $(ls /mnt/vroot/usr/lib/modules/ 2>/dev/null | tr '\n' ' ')"
          echo "  fnnas-install 4G-PROD 标记: $(sudo grep -c '4G-PROD' /mnt/vroot/usr/sbin/fnnas-install 2>/dev/null || echo 0)"
          echo "  已 enable 服务: $(sudo ls /mnt/vroot/etc/systemd/system/multi-user.target.wants/ 2>/dev/null | tr '\n' ' ')"
          if sudo test "$(sudo cat /mnt/vroot/etc/device_info/boot_board 2>/dev/null)" = "e900v22c"; then
            echo "✓ OTA 上报板型 /etc/device_info/boot_board = e900v22c"
          else
            echo "::error::/etc/device_info/boot_board 不是 e900v22c（OTA 上报错乱）"; fail=1
          fi
          if sudo test -f /mnt/vroot/usr/lib/fnnas-e900v22c/fnnas-update-wrapper.sh; then
            echo "✓ 内核 OTA 拦截器在位 ($(sudo stat -c%s /mnt/vroot/usr/lib/fnnas-e900v22c/fnnas-update-wrapper.sh 2>/dev/null) B)"
          else
            echo "::error::缺少内核 OTA 拦截器"; fail=1
          fi
          if sudo grep -q 'fnnas-update guard installed' /mnt/vroot/etc/rc.local 2>/dev/null; then
            echo "✓ rc.local 含 guard 安装钩"
          else
            echo "::error::rc.local 缺 guard 安装钩"; fail=1
          fi
          for m in serial-getty@ttyAMA0.service exim4.service led-set.service set_gpio-init.service nut-monitor.service nut-server.service; do
            if sudo test -L "/mnt/vroot/etc/systemd/system/$m"; then
              echo "✓ 已 mask $m"
            else
              echo "::error::缺少 mask $m"; fail=1
            fi
          done
          if sudo test -f /mnt/vroot/usr/lib/fnnas-e900v22c/fnnas-update-wrapper.sh; then
            grep -q 'PIN_PREFIX="\$(uname -r' /mnt/vroot/usr/lib/fnnas-e900v22c/fnnas-update-wrapper.sh || { echo "::error::镜像内 wrapper 未用动态 PIN_PREFIX"; fail=1; }
            echo "✓ 内核 OTA 拦截器动态 PIN 正确"
          else
            echo "::error::缺少内核 OTA 拦截器"; fail=1
          fi
          sudo umount /mnt/vroot || true
          sudo losetup -d "$LOOP" || true
          echo "::endgroup::"

          rm -f $TMP
          if [ "$fail" != "0" ]; then
            echo "::error::rootfs 结构守门未通过，禁止发布"; exit 1
          fi
          echo "✓ 全部校验通过，允许发布"

      - name: 准备 Release 附件
        id: assets
        run: |
          set -euo pipefail
          IMG="${{ steps.check.outputs.img }}"
          # 文件名带构建号保证唯一：同一天多次构建不再重名，
          # 否则连下两个 Release 会被下载器/解压软件自动改成 _2/(1)，还得手工改名
          IMG_FILE="$(basename "$IMG")"
          case "$IMG_FILE" in
            *.img.xz)  SUF="img.xz"; STEM="${IMG_FILE%.img.xz}" ;;
            *.img.gz)  SUF="img.gz"; STEM="${IMG_FILE%.img.gz}" ;;
            *.img.zst) SUF="img.zst"; STEM="${IMG_FILE%.img.zst}" ;;
            *)         SUF="img";     STEM="${IMG_FILE%.img}" ;;
          esac
          IMG_BASE="${STEM}.r${{ github.run_number }}.${SUF}"
          cp -f "$IMG" "$IMG_BASE"
          # 第二个附件：与镜像同源的 4G dtb
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SELF_REF}/${DTB_IN_FORK}" -o "$DTB_NAME"
          ls -lh "$IMG_BASE" "$DTB_NAME"
          echo "img_out=$IMG_BASE" >> $GITHUB_OUTPUT
          echo "IMG_OUT=$IMG_BASE" >> $GITHUB_ENV

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          {
            echo "## E900V22C (S905L3A) FnNAS 4G 运存"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 机型 | 创维 E900V22C / S905L3A（4G 运存） |"
            echo "| 内核 | ${KERNEL_VERSION}.c944-trim |"
            echo "| 内存 | 3927 MiB 可用（边界 0xf5700000，顶部 169MiB 留给 BL31/TEE 安全区） |"
            echo "| WiFi | 紫光展锐 UWE5621DS（需用户自行对 6.18 内核编译驱动） |"
            echo "| eMMC | DDR52 50MHz 时钟（规避 HS200 写通道不稳定） |"
            echo "| 安装脚本 | 生产版 fnnas-install：无 dtb 选择 / 仅 4G / 内存保护 |"
            echo "| 基础镜像 | ${{ steps.base.outputs.ver }} |"
            echo ""
            echo "### 两个文件"
            echo ""
            echo "- \`${IMG_OUT}\` — 系统镜像，用 balenaEtcher 写入 U 盘 / TF 卡（≥16GB）"
            echo "- \`${DTB_NAME}\` — 4G 运存 dtb，也可单独替换到已装系统的 \`/boot/dtb/amlogic/\`"
            echo ""
            echo "### 校验"
            echo ""
            echo '```'
            echo "$(sha256sum "${IMG_OUT}" | awk '{print "img sha256: "$1}')"
            echo "$(sha256sum "${DTB_NAME}" | awk '{print "dtb sha256: "$1}')"
            echo '```'
            echo ""
            echo "### 使用步骤"
            echo ""
            echo "1. balenaEtcher 写入 U 盘 / TF 卡"
            echo "2. 插到盒子开机（网线 + WiFi 都会自动连）"
            echo "3. 浏览器打开 \`http://<盒子IP>:5666\` 进入飞牛"
            echo "4. 想摆脱 U 盘：\`sudo fnnas-install\`（自动装到 eMMC）"
            echo ""
            echo "> 内存边界必须保持 0xf5700000。改成 0xfe000000（3.97G）看似多 143MiB，"
            echo "> 但内核 CMA 会压到 BL31/TEE 安全区上，安装大文件时核心进程会猝死。"
          } > release-notes.md
          cat release-notes.md

      - name: 发布 Release（只有 2 个附件）
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="e900v22c-$(date +%Y.%m.%d)-${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" "$IMG_OUT" "$DTB_NAME" --clobber
          else
            gh release create "$TAG" "$IMG_OUT" "$DTB_NAME" \
              --title "E900V22C 4G运存 ($TAG)" \
              --notes-file release-notes.md
          fi
          echo "=== Release 附件 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) B"'
          echo "url=$(gh release view "$TAG" --json url --jq .url)" >> $GITHUB_OUTPUT

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 状态 | ${{ steps.rel.outcome || '未完成' }} |"
            echo "| 内核 | ${KERNEL_VERSION}.c944-trim |"
            echo "| 产物 | ${IMG_OUT:-未生成} |"
            echo "| Release | ${{ steps.rel.outputs.url }} |"
          } >> $GITHUB_STEP_SUMMARY
